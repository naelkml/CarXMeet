services:

  nginx:
    image: nginx:latest
    ports:
      - "8080:80"
    volumes:
      - .:/var/www/html
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf
    depends_on:
      - php


  php:
    build:
      context: .
      dockerfile: docker/php/Dockerfile
    volumes:
      - .:/var/www/html
    depends_on:
      - database


  database:
    container_name: carxmeet_mysql
    image: mysql:8.4
    restart: always
    environment:
      MYSQL_DATABASE: carxmeet
      MYSQL_USER: carxmeet
      MYSQL_PASSWORD: carxmeet
      MYSQL_ROOT_PASSWORD: root

    ports:
      - "3306:3306"

    volumes:
      - mysql_data:/var/lib/mysql


volumes:

  mysql_data:

